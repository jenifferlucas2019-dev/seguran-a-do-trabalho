<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança do Trabalho</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <img id="img-principal" src="img/segurança.png">

    <h1>Segurança do Trabalho</h1>

    <div id="form">

        <div class="container-inputs">
            <label>Nome:</label>
            <input id="input-nome" type="text">
        </div>

        <div class="container-inputs">
            <label>Setor:</label>
            <input id="input-setor" type="text">
        </div>

        <div class="container-inputs">
            <label>Função:</label>
            <input id="input-funcao" type="text">
        </div>

        <div class="container-inputs">
            <label>Data:</label>
            <input id="input-data" type="date">
        </div>

        <div class="container-inputs">
            <label>Validade:</label>
            <input id="input-validade" type="date">
        </div>

        <button onclick="cadastrarFuncionario()">Cadastrar</button>
        <button onclick="pesquisarFuncionario()">Pesquisar</button>
        <button onclick="excluirFuncionario()">Excluir</button>

    </div>

    <hr>

    <div id="painel-funcionario"></div>

    <script src="script.js"></script>

</body>

</html>
